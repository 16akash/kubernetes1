apiVersion: apps/v1
kind: Deployment

metadata:
  name: vegetable-deployment
  labels:
    first: app

spec:  #defines the behaviour of deployment
  replicas: 3

  selector:
    matchLabels:
      app: vegetableapp

  template:
    metadata:
      labels:
        app: vegetableapp

    spec:  #defines behaviour of the pod
      containers:
        - name: vegetable-container
          image: 16akash/vege:v1.0.0

          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: prod-service

spec:
  selector:
    app: web
    ports:
      - protocol: TCP
        port: 4002
        targetPort: 4000
type: clusterIP
         