apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: prod-replicaset
  labels:
    app: web

spec:
  replicas: 4

  selector:
    matchLabels:
      web: nginx

  template:
    metadata:
      labels:
        web: nginx

    spec:
      containers:
        - image: nginx
          name: nginx-container
          ports:
            - containerPort: 80
