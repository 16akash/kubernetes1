apiVersion: apps/v1
kind: Deployment

metadata:
  name: fitness-deployment
  namespace: akash-ns

  labels:
    app: fitness

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fitness

  template:
    metadata:
      labels:
        app: fitness

    spec:
      containers:
        - name: fitness-container
          image: 16akash/akash:v1.0.0

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: akash-configmap
            - secretRef:
                name: akash-secrete   

---

apiVersion: v1
kind: Service

metadata:
  name: fitness-service
  namespace: akash-ns

spec:
  selector:
    app: fitness

  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

  type: LoadBalancer