apiVersion: apps/v1
kind: Deployment

metadata:
  name: prod-deployment
  labels:
    first: app

spec:  #defines the behaviour of deployment
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:  #defines behaviour of the pod
      containers:
        - name: nginx-container
          image: nginx

          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: prod-service

spec:
  selector:
    app: web
    ports:
      - protocol: TCP
        port: 85
        targetPort: 80
type: clusterIP
         